name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: rcms_user
          POSTGRES_PASSWORD: rcms_password
          POSTGRES_DB: rcms_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Alembic Migrations & Pytest
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+psycopg2://rcms_user:rcms_password@localhost:5432/rcms_test_db
          SECRET_KEY: ci-test-secret-key
        run: |
          alembic upgrade head
          pytest -v
