version: '3.9'

services:
  db:
    image: postgres:15-alpine
    container_name: rcms_postgres
    restart: unless-stopped
    env_file:
      - .env.example
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rcms_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rcms_password}
      POSTGRES_DB: ${POSTGRES_DB:-rcms_db}
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rcms_user} -d ${POSTGRES_DB:-rcms_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rcms_backend
    restart: unless-stopped
    env_file:
      - .env.example
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  postgres_data:
